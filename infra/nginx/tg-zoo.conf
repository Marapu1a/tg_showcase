server {
    listen 80;
    server_name tg-zoo.qianqi.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tg-showcase-acme; }
    location / { return 301 https://tg-zoo.qianqi.site$request_uri; }
}
server {
    listen 443 ssl;
    server_name tg-zoo.qianqi.site;
    ssl_certificate /etc/letsencrypt/live/tg-zoo.qianqi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg-zoo.qianqi.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /opt/tg-showcase/current/apps/miniapp/dist;
    server_tokens off;
    client_max_body_size 6m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tg-showcase-acme; }
    location ^~ /api/internal/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4230/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
